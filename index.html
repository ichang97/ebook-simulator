<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ink Reader (EPUB/PDF)</title>
    
    <style>
        /* CSS จำลองหน้าจอ E-ink */
        :root {
            --eink-bg: #f4f6f4;
            --eink-text: #111111;
        }
        body {
            background-color: var(--eink-bg);
            color: var(--eink-text);
            font-family: 'Bookerly', 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .controls {
            margin-bottom: 20px;
            font-family: sans-serif;
        }
        input[type="file"], button {
            background: #fff;
            border: 2px solid #111;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0;
            transition: none;
        }
        button:hover { background: #111; color: #fff; }
        
        #viewer-container {
            width: 100%;
            max-width: 800px;
            height: 75vh;
            background: #fff;
            border: 2px solid #111;
            overflow: auto;
            position: relative;
            
            /* บังคับขาวดำ และเร่งคอนทราสต์ให้ภาพแตกชัดขึ้น */
            filter: grayscale(100%) contrast(150%) brightness(95%);
        }

        /* บังคับให้ Canvas (PDF) และเนื้อหาข้างใน (EPUB) เรนเดอร์แบบแตกๆ */
        #viewer-container canvas,
        #viewer-container img {
            image-rendering: pixelated; 
        }
        
        #pdf-canvas { display: none; margin: 0 auto; }
