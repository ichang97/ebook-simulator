<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ink Reader (EPUB/PDF with Pixel Effect)</title>
    
    <style>
        :root {
            --eink-bg: #f4f6f4;
            --eink-text: #111111;
        }
        body {
            background-color: var(--eink-bg);
            color: var(--eink-text);
            font-family: 'Bookerly', 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .controls {
            margin-bottom: 20px;
            font-family: sans-serif;
        }
        input[type="file"], button {
            background: #fff;
            border: 2px solid #111;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0;
            transition: none;
        }
        button:hover { background: #111; color: #fff; }
        
        #viewer-container {
            width: 100%;
            max-width: 800px;
            height: 75vh;
            background: #fff;
            border: 2px solid #111;
            position: relative;
            
            /* บังคับขาวดำ และเร่งคอนทราสต์ให้ภาพแตกชัดขึ้น */
            filter: grayscale(100%) contrast(150%) brightness(95%);
        }

        #pdf-canvas { display: none; margin: 0 auto; width: 100%; height: 100%; object-fit: contain; }
        
        /* สไตล์สำหรับ EPUB Canvas */
        #epub-canvas { display: none; width: 100%; height: 100%; }

        /* แคนวาสชั่วคราวสำหรับ Downsampling */
        #temp-canvas { display: none; }

        @keyframes wipe-down {
            0% { clip-path: inset(0 0 100% 0); opacity: 0.8; }
            100% { clip-path: inset(0 0 0 0); opacity: 1; }
        }

        .refreshing {
            animation: wipe-down 0.4s ease-out;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

    <div class="controls">
        <input type="file" id="file-input" accept=".epub, .pdf">
        <button id="prev-btn">◀ หน้าก่อนหน้า</button>
        <button id="next-btn">หน้าถัดไป ▶</button>
    </div>

    <div id="viewer-container">
        <canvas id="pdf-canvas"></canvas>
        <canvas id="epub-canvas"></canvas>
    </div>

    <canvas id="temp-canvas"></canvas>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('file-input');
        const pdfCanvas = document.getElementById('pdf-canvas');
        const epubCanvas = document.getElementById('epub-canvas');
        const tempCanvas = document.getElementById('temp-canvas');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const viewerContainer = document.getElementById('viewer-container');

        let currentType = null; 
        let book = null;
        let rendition = null;
        let pdfDoc = null;
        let pageNum = 1;
        const ctxPdf = pdfCanvas.getContext('2d');
        const ctxEpub = epubCanvas.getContext('2d');
        const ctxTemp = tempCanvas.getContext('2d');

        function playWipeEffect() {
            viewerContainer.classList.remove('refreshing');
            void viewerContainer.offsetWidth; // Force reflow
            viewerContainer.classList.add('refreshing');
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const extension = file.name.split('.').pop().toLowerCase();
            const reader = new FileReader();

            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                
                pdfCanvas.style.display = 'none';
                epubCanvas.style.display = 'none';

                if (extension === 'epub') {
                    currentType = 'epub';
                    epubCanvas.style.display = 'block';
                    renderEpub(arrayBuffer);
                } else if (extension === 'pdf') {
                    currentType = 'pdf';
                    pdfCanvas.style.display = 'block';
                    pageNum = 1;
                    renderPdf(arrayBuffer);
                }
            };
            
            reader.readAsArrayBuffer(file);
        });

        // --- ระบบ Downsampling สำหรับ Pixel Effect ---
        function applyPixelEffect(sourceCanvas, targetCanvas, targetCtx) {
            const pixelSize = 4; // ขนาดของพิกเซลบล็อก ยิ่งมากยิ่งแตก
            const width = sourceCanvas.width;
            const height = sourceCanvas.height;

            targetCanvas.width = width;
            targetCanvas.height = height;

            // 1. วาดลงแคนวาสชั่วคราวแบบเล็ก
            const downWidth = Math.ceil(width / pixelSize);
            const downHeight = Math.ceil(height / pixelSize);
            tempCanvas.width = downWidth;
            tempCanvas.height = downHeight;
            ctxTemp.drawImage(sourceCanvas, 0, 0, downWidth, downHeight);

            // 2. ขยายกลับขึ้นมาแบบไม่ลดรอยหยัก (image-rendering: pixelated)
            targetCtx.imageSmoothingEnabled = false;
            targetCtx.drawImage(tempCanvas, 0, 0, downWidth, downHeight, 0, 0, width, height);
            
            // 3. จำลองเอฟเฟกต์จอ E-ink เบาๆ (เช่น แสงสะท้อนเล็กน้อย)
            targetCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            targetCtx.fillRect(0, 0, width, height);

            playWipeEffect();
        }

        // --- ระบบ Render EPUB ---
        // เนื่องจาก epub.js แสดงผลใน iframe เราต้องสร้างแคนวาสขึ้นมาแทนที่
        // แล้วสั่งวาด iframe content ลงบนแคนวาส
        async function drawEpubPageToCanvas() {
            if (!rendition) return;
            const iframe = viewerContainer.querySelector('iframe');
            if (!iframe) return;

            // คอยจนกว่า EPUB จะโหลดหน้าใหม่เสร็จ
            await new Promise(resolve => rendition.on("rendered", resolve));

            // สร้าง Canvas ชั่วคราวจาก iframe content
            // *หมายเหตุ: วิธีนี้อาจจะมีปัญหาเรื่อง Cross-Origin ถ้าโหลดไฟล์จากเว็บอื่น*
            try {
                // สำหรับไฟล์โลคอล ให้ใช้เทคนิคการวาด iframe ลงบน canvas
                const {contentDocument} = iframe;
                const {body} = contentDocument;
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = iframe.offsetWidth;
                canvas.height = iframe.offsetHeight;
                
                // สั่งวาด html -> canvas (มีความซับซ้อนและอาจไม่ได้ผลสมบูรณ์ในทุกไฟล์)
                // เป็นข้อจำกัดของการจำลองในเบราว์เซอร์
                const foreignObject = `
                    <foreignObject width="100%" height="100%">
                        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: inherit;">
                            ${body.innerHTML}
                        </div>
                    </foreignObject>
                `;
                const svgString = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="${canvas.width}" height="${canvas.height}">
                        ${foreignObject}
                    </svg>
                `;
                const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
                
                const img = new Image();
                img.onload = function() {
                    applyPixelEffect(canvas, epubCanvas, ctxEpub);
                };
                img.src = svgUrl;

            } catch (error) {
                console.error("Failed to capture iframe to canvas", error);
                // ถ้าล้มเหลว ให้แสดงเนื้อหาปกติใน iframe ไป
                epubCanvas.style.display = 'none';
                iframe.style.display = 'block';
                playWipeEffect();
            }
        }

        function renderEpub(arrayBuffer) {
            book = ePub(arrayBuffer);
            rendition = book.renderTo("viewer-container", {
                width: "100%",
                height: "100%",
                spread: "none"
            });
            
            // แทนที่จะ .display().then() เราต้องรอให้ rendition บอกว่าเรนเดอร์เสร็จแล้ว
            rendition.display();
            
            // ฟังอีเวนต์การเปลี่ยนหน้าเพื่อวาดลง Canvas
            rendition.on("relocated", drawEpubPageToCanvas);

            // ซ่อน iframe ที่ epub.js สร้างขึ้นมา
            rendition.hooks.content.register(function(contents) {
                const iframe = contents.content;
                iframe.style.visibility = 'hidden'; // ซ่อนเพื่อแสดง Canvas แทน
            });
        }

        // --- ระบบ Render PDF ---
        function renderPdf(arrayBuffer) {
            pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function(pdfDocument) {
                pdfDoc = pdfDocument;
                renderPdfPage(pageNum);
            });
        }

        async function renderPdfPage(num) {
            if (!pdfDoc) return;
            const page = await pdfDoc.getPage(num);
            
            // PDF.js มี .render ซึ่งสามารถวาดลงบน Canvas ได้เลย
            // เราแค่ต้องขยายขนาดให้สูงเพื่อทำ Downsampling
            const viewport = page.getViewport({ scale: 2 }); // ขยายขนาด
            const canvas = document.createElement('canvas'); // แคนวาสชั่วคราว
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            
            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };
            await page.render(renderContext).promise;

            applyPixelEffect(canvas, pdfCanvas, ctxPdf);
        }

        // --- ระบบเปลี่ยนหน้า ---
        prevBtn.addEventListener('click', () => {
            if (currentType === 'epub' && rendition) {
                rendition.prev();
            } else if (currentType === 'pdf' && pdfDoc) {
                if (pageNum > 1) {
                    pageNum--;
                    renderPdfPage(pageNum);
                }
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentType === 'epub' && rendition) {
                rendition.next();
            } else if (currentType === 'pdf' && pdfDoc) {
                if (pageNum < pdfDoc.numPages) {
                    pageNum++;
                    renderPdfPage(pageNum);
                }
            }
        });
    </script>
</body>
</html>
