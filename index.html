<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ink Reader (EPUB/PDF)</title>
    
    <style>
        :root {
            --eink-bg: #f4f6f4; /* สีเทากระดาษ */
            --eink-text: #111111; /* สีดำด้าน */
        }
        body {
            background-color: var(--eink-bg);
            color: var(--eink-text);
            font-family: 'Bookerly', 'Georgia', serif; /* ฟอนต์มีหัวแบบเครื่องอ่าน E-book */
            /* หัวใจหลักของ E-ink: บังคับขาวดำ และเพิ่มความสว่าง/คอนทราสต์ให้เหมือนหมึกบนกระดาษ */
            filter: grayscale(100%) contrast(120%) brightness(95%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .controls {
            margin-bottom: 20px;
            font-family: sans-serif;
        }
        input[type="file"], button {
            background: #fff;
            border: 2px solid #111;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0; /* ตัดขอบมนทิ้ง E-ink UI มักจะเหลี่ยมๆ */
            transition: none; /* ห้ามมีแอนิเมชัน เพื่อให้ดูหน่วงแบบ E-ink */
        }
        button:hover { background: #111; color: #fff; }
        
        #viewer-container {
            width: 100%;
            max-width: 800px;
            height: 75vh;
            background: #fff;
            border: 2px solid #111;
            overflow: auto;
            position: relative;
            box-shadow: none; /* ห้ามมีเงา */
        }
        
        /* ซ่อน Canvas ของ PDF ก่อนถ้ายังไม่ได้ใช้ */
        #pdf-canvas { display: none; margin: 0 auto; }
        #epub-viewer { height: 100%; width: 100%; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

    <div class="controls">
        <input type="file" id="file-input" accept=".epub, .pdf">
        <button id="prev-btn">◀ หน้าก่อนหน้า</button>
        <button id="next-btn">หน้าถัดไป ▶</button>
    </div>

    <div id="viewer-container">
        <div id="epub-viewer"></div>
        <canvas id="pdf-canvas"></canvas>
    </div>

    <script>
        // เซ็ต Worker ให้ PDF.js ตามมาตรฐาน Docs
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('file-input');
        const epubViewer = document.getElementById('epub-viewer');
        const pdfCanvas = document.getElementById('pdf-canvas');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        let currentType = null; 
        
        // ตัวแปรเก็บ State ของ EPUB
        let book = null;
        let rendition = null;

        // ตัวแปรเก็บ State ของ PDF
        let pdfDoc = null;
        let pageNum = 1;
        const ctx = pdfCanvas.getContext('2d');

        // เมื่อมีการอัปโหลดไฟล์
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const extension = file.name.split('.').pop().toLowerCase();
            const reader = new FileReader();

            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                
                // เคลียร์หน้าจอเดิม
                epubViewer.innerHTML = '';
                pdfCanvas.style.display = 'none';
                epubViewer.style.display = 'none';

                if (extension === 'epub') {
                    currentType = 'epub';
                    epubViewer.style.display = 'block';
                    renderEpub(arrayBuffer);
                } else if (extension === 'pdf') {
                    currentType = 'pdf';
                    pdfCanvas.style.display = 'block';
                    pageNum = 1; // รีเซ็ตหน้า
                    renderPdf(arrayBuffer);
                }
            };
            
            // อ่านไฟล์เป็น ArrayBuffer (รองรับทั้ง epubjs และ pdfjs)
            reader.readAsArrayBuffer(file);
        });

        // --- ระบบ Render EPUB ---
        function renderEpub(arrayBuffer) {
            book = ePub(arrayBuffer);
            rendition = book.renderTo("epub-viewer", {
                width: "100%",
                height: "100%",
                spread: "none" // บังคับให้แสดงหน้าเดียวแบบ E-reader
            });
            rendition.display();
        }

        // --- ระบบ Render PDF ---
        function renderPdf(arrayBuffer) {
            pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function(pdfDocument) {
                pdfDoc = pdfDocument;
                renderPdfPage(pageNum);
            });
        }

        function renderPdfPage(num) {
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: 1.5 }); // ขยายขนาดให้ชัดขึ้น
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                page.render(renderContext);
            });
        }

        // --- ระบบเปลี่ยนหน้า ---
        prevBtn.addEventListener('click', () => {
            if (currentType === 'epub' && rendition) {
                rendition.prev();
            } else if (currentType === 'pdf' && pdfDoc) {
                if (pageNum <= 1) return;
                pageNum--;
                renderPdfPage(pageNum);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentType === 'epub' && rendition) {
                rendition.next();
            } else if (currentType === 'pdf' && pdfDoc) {
                if (pageNum >= pdfDoc.numPages) return;
                pageNum++;
                renderPdfPage(pageNum);
            }
        });
    </script>
</body>
</html>
