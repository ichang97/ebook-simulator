<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ink Reader (EPUB/PDF)</title>
    
    <style>
        /* CSS จำลองหน้าจอ E-ink */
        :root {
            --eink-bg: #f4f6f4;
            --eink-text: #111111;
        }
        body {
            background-color: var(--eink-bg);
            color: var(--eink-text);
            font-family: 'Bookerly', 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .controls {
            margin-bottom: 20px;
            font-family: sans-serif;
        }
        input[type="file"], button {
            background: #fff;
            border: 2px solid #111;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0;
            transition: none;
        }
        button:hover { background: #111; color: #fff; }
        
        #viewer-container {
            width: 100%;
            max-width: 800px;
            height: 75vh;
            background: #fff;
            border: 2px solid #111;
            overflow: auto;
            position: relative;
            
            /* บังคับขาวดำ และเร่งคอนทราสต์ให้ภาพแตกชัดขึ้น */
            filter: grayscale(100%) contrast(150%) brightness(95%);
        }

        /* บังคับให้ Canvas (PDF) และเนื้อหาข้างใน (EPUB) เรนเดอร์แบบแตกๆ */
        #viewer-container canvas,
        #viewer-container img {
            image-rendering: pixelated; 
        }
        
        #pdf-canvas { display: none; margin: 0 auto; }
        #epub-viewer { height: 100%; width: 100%; }

        /* Animation สำหรับเอฟเฟกต์เฟดจากบนลงล่าง */
        @keyframes wipe-down {
            0% { clip-path: inset(0 0 100% 0); opacity: 0.8; }
            100% { clip-path: inset(0 0 0 0); opacity: 1; }
        }

        .refreshing {
            animation: wipe-down 0.4s ease-out;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

    <div class="controls">
        <input type="file" id="file-input" accept=".epub, .pdf">
        <button id="prev-btn">◀ หน้าก่อนหน้า</button>
        <button id="next-btn">หน้าถัดไป ▶</button>
    </div>

    <div id="viewer-container">
        <div id="epub-viewer"></div>
        <canvas id="pdf-canvas"></canvas>
    </div>

    <script>
        // เซ็ต Worker ให้ PDF.js ตามมาตรฐาน Docs
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('file-input');
        const epubViewer = document.getElementById('epub-viewer');
        const pdfCanvas = document.getElementById('pdf-canvas');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const viewerContainer = document.getElementById('viewer-container');

        let currentType = null; 
        let book = null;
        let rendition = null;
        let pdfDoc = null;
        let pageNum = 1;
        const ctx = pdfCanvas.getContext('2d');

        // ฟังก์ชันเล่น Effect เฟดลง (เรียกใช้หลังจาก Render หน้าใหม่เสร็จแล้ว)
        function playWipeEffect() {
            viewerContainer.classList.remove('refreshing');
            void viewerContainer.offsetWidth; // บังคับให้เบราว์เซอร์ Reflow
            viewerContainer.classList.add('refreshing');
        }

        // เมื่ออัปโหลดไฟล์
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const extension = file.name.split('.').pop().toLowerCase();
            const reader = new FileReader();

            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                
                epubViewer.innerHTML = '';
                pdfCanvas.style.display = 'none';
                epubViewer.style.display = 'none';

                if (extension === 'epub') {
                    currentType = 'epub';
                    epubViewer.style.display = 'block';
                    renderEpub(arrayBuffer);
                } else if (extension === 'pdf') {
                    currentType = 'pdf';
                    pdfCanvas.style.display = 'block';
                    pageNum = 1;
                    renderPdf(arrayBuffer);
                }
            };
            
            reader.readAsArrayBuffer(file);
        });

        // --- ระบบ Render EPUB ---
        function renderEpub(arrayBuffer) {
            book = ePub(arrayBuffer);
            rendition = book.renderTo("epub-viewer", {
                width: "100%",
                height: "100%",
                spread: "none" // บังคับแสดงหน้าเดียวแบบ E-reader
            });
            
            // แสดงหน้าแรกแล้วเล่น Effect
            rendition.display().then(playWipeEffect);

            // Inject CSS เข้าไปใน iframe ของ EPUB ให้รูปภาพแตกเป็นพิกเซล
            rendition.hooks.content.register(function(contents) {
                contents.addStylesheetRules([
                    ["img", ["image-rendering: pixelated !important"]]
                ]);
            });
        }

        // --- ระบบ Render PDF ---
        function renderPdf(arrayBuffer) {
            pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function(pdfDocument) {
                pdfDoc = pdfDocument;
                renderPdfPage(pageNum).then(playWipeEffect); // แสดงหน้าแรกแล้วเล่น Effect
            });
        }

        function renderPdfPage(num) {
            return pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: 1.5 });
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                // ส่งคืน Promise เพื่อบอกว่า Render เสร็จแล้ว
                return page.render(renderContext).promise; 
            });
        }

        // --- ระบบเปลี่ยนหน้า ---
        prevBtn.addEventListener('click', () => {
            if (currentType === 'epub' && rendition) {
                rendition.prev().then(playWipeEffect);
            } else if (currentType === 'pdf' && pdfDoc) {
                if (pageNum > 1) {
                    pageNum--;
                    renderPdfPage(pageNum).then(playWipeEffect);
                }
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentType === 'epub' && rendition) {
                rendition.next().then(playWipeEffect);
            } else if (currentType === 'pdf' && pdfDoc) {
                if (pageNum < pdfDoc.numPages) {
                    pageNum++;
                    renderPdfPage(pageNum).then(playWipeEffect);
                }
            }
        });
    </script>
</body>
</html>
