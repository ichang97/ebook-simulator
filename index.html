<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ink Reader (Pixelated & Wipe Effect)</title>
    
    <style>
        :root {
            --eink-bg: #f4f6f4;
            --eink-text: #111111;
        }
        body {
            background-color: var(--eink-bg);
            color: var(--eink-text);
            font-family: 'Bookerly', 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .controls {
            margin-bottom: 20px;
            font-family: sans-serif;
        }
        input[type="file"], button {
            background: #fff;
            border: 2px solid #111;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0;
        }
        button:hover { background: #111; color: #fff; }
        
        #viewer-container {
            width: 100%;
            max-width: 800px;
            height: 75vh;
            background: #fff;
            border: 2px solid #111;
            overflow: auto;
            position: relative;
            
            /* บังคับขาวดำ และเร่งคอนทราสต์ให้ภาพแตกชัดขึ้น */
            filter: grayscale(100%) contrast(150%) brightness(95%);
        }

        /* บังคับให้ Canvas (PDF) และเนื้อหาข้างใน (EPUB) เรนเดอร์แบบแตกๆ */
        #viewer-container canvas,
        #viewer-container img {
            image-rendering: pixelated; /* ทำให้พิกเซลเหลี่ยม ไม่เบลอขอบ */
        }
        
        #pdf-canvas { display: none; margin: 0 auto; }
        #epub-viewer { height: 100%; width: 100%; }

        /* Animation สำหรับเอฟเฟกต์เฟดจากบนลงล่าง */
        @keyframes wipe-down {
            0% { clip-path: inset(0 0 100% 0); opacity: 0.8; } /* เริ่มจากซ่อนเนื้อหาด้านล่างทั้งหมด */
            100% { clip-path: inset(0 0 0 0); opacity: 1; }   /* โชว์เต็มจอ */
        }

        .refreshing {
            animation: wipe-down 0.4s ease-out; /* ความเร็ว 0.4 วิ ให้ดูเหมือนจอ Refresh */
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

    <div class="controls">
        <input type="file" id="file-input" accept=".epub, .pdf">
        <button id="prev-btn">◀ หน้าก่อนหน้า</button>
        <button id="next-btn">หน้าถัดไป ▶</button>
    </div>

    <div id="viewer-container">
        <div id="epub-viewer"></div>
        <canvas id="pdf-canvas"></canvas>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('file-input');
        const epubViewer = document.getElementById('epub-viewer');
        const pdfCanvas = document.getElementById('pdf-canvas');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const viewerContainer = document.getElementById('viewer-container');

        let currentType = null; 
        let book = null;
        let rendition = null;
        let pdfDoc = null;
        let pageNum = 1;
        const ctx = pdfCanvas.getContext('2d');

        // ฟังก์ชันจัดการ Animation เวลาเปลี่ยนหน้า
        function triggerRefresh(actionCallback) {
            // ถอด Class เดิมออก และบังคับให้เบราว์เซอร์ Reflow เพื่อให้ Animation เริ่มใหม่ได้
            viewerContainer.classList.remove('refreshing');
            void viewerContainer.offsetWidth; 
            
            // รันคำสั่งเปลี่ยนหน้า (ไปหน้าถัดไป หรือ หน้าก่อนหน้า)
            actionCallback();
            
            // ใส่ Class กลับเข้าไปเพื่อเล่น Animation จากบนลงล่าง
            viewerContainer.classList.add('refreshing');
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const extension = file.name.split('.').pop().toLowerCase();
            const reader = new FileReader();

            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                epubViewer.innerHTML = '';
                pdfCanvas.style.display = 'none';
                epubViewer.style.display = 'none';

                if (extension === 'epub') {
                    currentType = 'epub';
                    epubViewer.style.display = 'block';
                    renderEpub(arrayBuffer);
                } else if (extension === 'pdf') {
                    currentType = 'pdf';
                    pdfCanvas.style.display = 'block';
                    pageNum = 1;
                    renderPdf(arrayBuffer);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function renderEpub(arrayBuffer) {
            if (rendition) {
                rendition.destroy();
                rendition = null;
            }
            if (book) {
                book = null;
            }

            book = ePub(arrayBuffer);
            rendition = book.renderTo(epubViewer, {
                width: '100%',
                height: '100%',
                spread: 'always',
                flow: 'paginated'
            });

            rendition.themes.default({
                body: {
                    background: '#ffffff',
                    color: '#111111',
                    margin: '0',
                    padding: '0',
                    'font-family': 'serif'
                }
            });

            rendition.on('rendered', function() {
                viewerContainer.classList.add('refreshing');
            });

            rendition.display().catch(function(error) {
                console.error('EPUB render error:', error);
                alert('ไม่สามารถแสดง EPUB ได้ โปรดลองไฟล์อื่น');
            });
        }

        function renderPdf(arrayBuffer) {
            pdfDoc = null;
            pageNum = 1;

            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            loadingTask.promise.then(function(pdf) {
                pdfDoc = pdf;
                renderPdfPage(pageNum);
            }).catch(function(error) {
                console.error('PDF load error:', error);
                alert('ไม่สามารถโหลดไฟล์ PDF ได้ โปรดลองไฟล์อื่น');
            });
        }

        function renderPdfPage(num) {
            if (!pdfDoc) return;

            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: 1.4 });
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(function() {
                    viewerContainer.classList.add('refreshing');
                });
            }).catch(function(error) {
                console.error('PDF page render error:', error);
            });
        }

        prevBtn.addEventListener('click', function() {
            if (currentType === 'pdf' && pdfDoc && pageNum > 1) {
                pageNum -= 1;
                renderPdfPage(pageNum);
            } else if (currentType === 'epub' && rendition) {
                rendition.prev();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentType === 'pdf' && pdfDoc && pageNum < pdfDoc.numPages) {
                pageNum += 1;
                renderPdfPage(pageNum);
            } else if (currentType === 'epub' && rendition) {
                rendition.next();
            }
        });
    </script>
</body>
</html>
